version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: localize-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - ENVIRONMENT=production
      - HOST=0.0.0.0
      - PORT=8000
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DB_PATH=/app/storage/dubforge.db
      - STORAGE_DIR=/app/storage
      - SHARED_FOLDER_PATH=/app/shared
    volumes:
      - ./storage:/app/storage
      - ./shared:/app/shared
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - localize-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: localize-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - BACKEND_URL=http://backend:8000
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - localize-net

networks:
  localize-net:
    driver: bridge
