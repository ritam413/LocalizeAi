version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: localize-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - ENVIRONMENT=production
      - HOST=0.0.0.0
      - PORT=8000
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:3b}
      - DB_PATH=/app/storage/dubforge.db
      - STORAGE_DIR=/app/storage
      - SHARED_FOLDER_PATH=/app/shared
      - TMPDIR=/app/storage/tmp
      - TEMP=/app/storage/tmp
      - TMP=/app/storage/tmp
      - TORCH_HOME=/app/storage/models/torch
      - HF_HOME=/app/storage/models/huggingface
      - HUGGINGFACE_HUB_CACHE=/app/storage/models/huggingface
    volumes:
      - ./storage:/app/storage
      - ./shared:/app/shared
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      ollama:
        condition: service_started
    networks:
      - localize-net

  ollama:
    image: ollama/ollama:latest
    container_name: localize-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ./docker_data/ollama:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-0}
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_MODELS=/root/.ollama/models
    networks:
      - localize-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: localize-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - BACKEND_URL=http://backend:8000
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - localize-net

networks:
  localize-net:
    driver: bridge
